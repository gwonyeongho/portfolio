<title>권영호 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root {
    --accent: #c97855;
    --accent-soft: #f1ddd2;
    --accent-strong: #9f573c;
    --background: #fffdfa;
    --surface: #ffffff;
    --surface-soft: #f8f5ef;
    --surface-muted: #ebe4da;
    --border: #e5ded5;
    --border-strong: #d5cabe;
    --text-primary: #25231f;
    --text-secondary: #716b63;
    --text-subtle: #9a9187;
    --font-sans: "Pretendard Variable", Pretendard, "IBM Plex Sans KR", -apple-system,
      BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --max-width: 1220px;
    --header-height: 74px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --shadow: 0 18px 48px rgba(75, 57, 43, 0.08);
    --shadow-soft: 0 2px 10px rgba(75, 57, 43, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--background);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, p, ul, ol, li, figure { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.02em; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
  }

  /* ---------- intro overlay ---------- */

  .intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--background);
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  .intro.is-dismissed { opacity: 0; pointer-events: none; }
  .intro[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .intro { transition: none; }
  }

  .intro-center { position: relative; z-index: 2; text-align: center; padding: 0 24px; }

  .intro-eyebrow {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .intro-name {
    margin-top: 14px;
    font-size: clamp(4rem, 13vw, 8.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.045em;
  }

  .intro-cta { margin-top: 34px; }

  .intro-chips {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .chip {
    position: absolute;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-soft);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    animation: drift 7s ease-in-out infinite alternate;
  }
  .chip svg { width: 13px; height: 13px; stroke: var(--accent); flex: none; }

  @keyframes drift {
    from { transform: translateY(-7px); }
    to { transform: translateY(7px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .chip { animation: none; }
  }

  /* ---------- header ---------- */

  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: var(--header-height);
    background: rgba(255, 253, 250, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: var(--max-width);
    height: 100%;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .header-mark {
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .site-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .site-nav::-webkit-scrollbar { display: none; }

  .site-nav a {
    padding: 7px 11px;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .site-nav a:hover { color: var(--text-primary); background: var(--surface-soft); }
  .site-nav a.is-active { color: var(--accent-strong); background: var(--accent-soft); }

  /* ---------- shared layout ---------- */

  .wrap {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 32px;
  }

  .section { padding: 96px 0; border-top: 1px solid var(--border); }
  .section:first-of-type { border-top: none; }

  .section-eyebrow {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .section-title {
    margin-top: 10px;
    font-size: clamp(1.875rem, 4vw, 2.5rem);
    font-weight: 700;
  }

  .section-lede {
    margin-top: 14px;
    max-width: 62ch;
    color: var(--text-secondary);
  }

  .section-body { margin-top: 48px; }

  /* ---------- buttons ---------- */

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .btn:hover { background: var(--surface-soft); border-color: var(--text-subtle); }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  /* ---------- hero ---------- */

  .hero { padding: 88px 0 96px; }

  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    gap: 64px;
    align-items: center;
  }

  .hero-name {
    font-size: clamp(3rem, 7vw, 4.75rem);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }

  .hero-role {
    margin-top: 18px;
    font-size: clamp(1.375rem, 2.6vw, 1.875rem);
    font-weight: 600;
    line-height: 1.35;
    color: var(--text-primary);
  }

  .hero-tagline {
    margin-top: 22px;
    max-width: 46ch;
    color: var(--text-secondary);
  }

  .hero-actions {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .hero-portrait {
    width: 100%;
    max-width: 380px;
    margin-left: auto;
    aspect-ratio: 4 / 5;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background:
      radial-gradient(120% 90% at 70% 8%, var(--accent-soft) 0%, transparent 62%),
      var(--surface-soft);
    box-shadow: var(--shadow);
    display: grid;
    place-content: center;
    gap: 12px;
    text-align: center;
    padding: 32px;
  }

  .portrait-monogram {
    font-size: clamp(3.5rem, 7vw, 5rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    color: var(--accent-strong);
    line-height: 1;
  }

  .portrait-caption {
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }

  /* ---------- about ---------- */

  .about-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 56px;
    align-items: start;
  }

  .prose { display: flex; flex-direction: column; gap: 18px; }
  .prose p { max-width: 60ch; color: var(--text-secondary); }
  .prose strong { color: var(--text-primary); font-weight: 600; }

  .focus-list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    overflow: hidden;
  }

  .focus-list li {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .focus-list li:last-child { border-bottom: none; }

  .focus-index {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent);
    flex: none;
  }

  .focus-label { font-weight: 600; font-size: 0.9375rem; }
  .focus-note { display: block; font-size: 0.8125rem; color: var(--text-secondary); font-weight: 400; }

  /* ---------- skills ---------- */

  .skill-groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }

  .skill-group {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .skill-group h3 {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 7px; }

  .skill-rows { display: flex; flex-direction: column; }

  .skill-rows li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px dashed var(--border);
  }
  .skill-rows li:last-child { border-bottom: none; }

  .skill-name { font-size: 0.9375rem; font-weight: 600; }

  .level-meter { display: flex; gap: 3px; }
  .level-meter i {
    width: 16px;
    height: 5px;
    border-radius: 2px;
    background: var(--surface-muted);
  }
  .level-meter i.on { background: var(--accent); }

  .level-label {
    min-width: 2.5em;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .tag {
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-soft);
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text-secondary);
  }

  /* ---------- projects ---------- */

  .project-list { display: flex; flex-direction: column; gap: 24px; }

  .project {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow-soft);
    padding: 32px;
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 40px;
  }

  .project-meta { display: flex; flex-direction: column; gap: 12px; }

  .project-date {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .status {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .status-live { background: var(--accent-soft); color: var(--accent-strong); }
  .status-done { background: var(--surface-muted); color: var(--text-secondary); }

  .project-role {
    font-size: 0.8125rem;
    color: var(--text-secondary);
  }
  .project-role span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-subtle);
    margin-bottom: 3px;
  }

  .project-title { font-size: 1.625rem; font-weight: 700; }
  .project-subtitle { margin-top: 6px; font-size: 1rem; font-weight: 600; color: var(--accent-strong); }
  .project-summary { margin-top: 14px; max-width: 62ch; color: var(--text-secondary); }

  .bullets { margin-top: 20px; display: flex; flex-direction: column; gap: 9px; }
  .bullets li {
    position: relative;
    padding-left: 17px;
    font-size: 0.9375rem;
    color: var(--text-secondary);
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.65em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .project-tags { margin-top: 22px; }

  .project-links { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }

  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    font-size: 0.875rem;
    font-weight: 600;
    transition: background 0.2s ease;
  }
  .link-pill:hover { background: var(--surface-soft); }

  /* ---------- timeline ---------- */

  .timeline { display: flex; flex-direction: column; }

  .timeline-item {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 40px;
    padding: 32px 0;
    border-top: 1px solid var(--border);
  }
  .timeline-item:first-child { border-top: none; padding-top: 0; }

  .timeline-date {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .timeline-org { font-size: 1.25rem; font-weight: 700; }
  .timeline-sub { margin-top: 4px; font-size: 0.9375rem; font-weight: 600; color: var(--accent-strong); }
  .timeline-desc { margin-top: 12px; max-width: 62ch; color: var(--text-secondary); }

  .stat-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .stat {
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    font-variant-numeric: tabular-nums;
  }
  .stat dt {
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  .stat dd { margin: 2px 0 0; font-size: 0.9375rem; font-weight: 600; }

  /* ---------- certifications ---------- */

  .cert-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 360px));
    justify-content: start;
    gap: 20px;
  }

  .cert {
    padding: 26px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-lg);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cert-date { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--text-secondary); }
  .cert-name { font-size: 1.1875rem; font-weight: 700; }
  .cert-issuer { font-size: 0.9375rem; color: var(--text-secondary); }

  /* ---------- contact ---------- */

  .contact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }

  .contact-card {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .contact-card dt {
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  .contact-card dd { margin: 0; font-size: 1.0625rem; font-weight: 600; word-break: break-all; }
  .contact-card dd a { border-bottom: 1px solid var(--border-strong); }
  .contact-card dd a:hover { color: var(--accent-strong); border-color: var(--accent); }

  .site-footer {
    padding: 40px 0 56px;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
    color: var(--text-subtle);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
  }

  /* ---------- responsive ---------- */

  @media (max-width: 960px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .hero-portrait { max-width: 320px; }
    .about-grid { grid-template-columns: 1fr; gap: 36px; }
    .project { grid-template-columns: 1fr; gap: 24px; padding: 26px; }
    .timeline-item { grid-template-columns: 1fr; gap: 14px; }
  }

  @media (max-width: 720px) {
    .wrap, .header-inner { padding: 0 20px; }
    .section { padding: 68px 0; }
    .hero { padding: 56px 0 68px; }
    .header-mark { display: none; }
    .site-nav { width: 100%; justify-content: flex-start; }
    .chip { display: none; }
    .chip.chip-keep { display: inline-flex; }
  }

  /* ---------- profile photo (CONTENT.photo 를 채우면 적용됨) ---------- */

  .hero-portrait.has-photo { padding: 0; overflow: hidden; }
  .hero-portrait.has-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>

<div class="intro" id="intro">
  <div class="intro-chips" id="intro-chips" aria-hidden="true"></div>
  <div class="intro-center">
    <p class="intro-eyebrow" id="intro-eyebrow"></p>
    <h1 class="intro-name" id="intro-name"></h1>
    <div class="intro-cta">
      <button class="btn btn-primary" type="button" id="intro-enter">포트폴리오 보기 ↗</button>
    </div>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <a class="header-mark" href="#hero" id="header-mark"></a>
    <nav class="site-nav" id="site-nav" aria-label="섹션 이동"></nav>
  </div>
</header>

<main id="main"></main>

<footer class="site-footer wrap" id="site-footer"></footer>

<script>
/* ==========================================================================
   여기만 고치면 사이트 내용이 바뀝니다.
   아래 CONTENT 객체가 페이지의 모든 글과 목록을 담고 있습니다.
   HTML이나 CSS는 건드리지 않아도 됩니다.

   기본 규칙
   - 글자는 반드시 따옴표 "" 로 감쌉니다.
   - 항목과 항목 사이에는 쉼표 , 를 넣습니다.
   - 목록 [ ... ] 에서 항목을 지우면 화면에서도 사라집니다.
   - 어떤 섹션의 목록을 완전히 비우면 그 섹션과 메뉴가 함께 사라집니다.
   ========================================================================== */

const CONTENT = {

  /* ── 기본 정보 ───────────────────────────────────────────────── */

  name: "권영호",
  nameEn: "Kwon Yeongho",
  role: "Embedded / Robotics / AI Software Developer",

  // 인트로 화면 이름 위에 작게 들어가는 줄
  introEyebrow: "임베디드 · 로보틱스 · AI 소프트웨어 개발자",

  // 이름 아래 소개 한두 문장
  tagline: "센서와 하드웨어에서 출발해 AI 인식과 3D·VR 환경으로 이어지는 시스템을 설계하고 구현하는 개발자입니다.",

  // 프로필 사진: 사진 파일을 이 폴더에 넣고 파일명을 적으세요. 예) "profile.jpg"
  // 비워두면 아래 monogram 글자가 대신 보입니다.
  photo: "",
  monogram: "YH",

  /* ── 연락처 ─────────────────────────────────────────────────── */

  contact: {
    email: "dudgh2030@naver.com",
    phone: "010-5642-8529",   // 공개하지 않으려면 "" 로 비우세요
    github: "gwonyeongho",    // 아이디만. 주소는 자동으로 만들어집니다
  },

  /* ── 인트로 화면에 떠다니는 키워드 ──────────────────────────── */

  introChips: [
    "C / C++", "Python", "Linux", "ROS2", "Unreal Engine 5",
    "Raspberry Pi", "MATLAB / Simulink", "VR / XR", "로봇 통신 제어", "스마트기기",
  ],

  /* ── 소개 ───────────────────────────────────────────────────── */

  about: {

/* ==========================================================================
   여기부터는 위 내용을 화면에 그리는 코드입니다. 고치지 않아도 됩니다.
   ========================================================================== */

(function () {
  "use strict";

  var LEVEL_NAMES = { 1: "초급", 2: "중급", 3: "고급" };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null && text !== "") node.textContent = text;
    return node;
  }

  function add(parent, child) {
    if (child) parent.appendChild(child);
    return parent;
  }

  function tagRow(items, extraClass) {
    if (!items || !items.length) return null;
    var row = el("div", extraClass ? extraClass + " tag-row" : "tag-row");
    items.forEach(function (t) { add(row, el("span", "tag", t)); });
    return row;
  }

  function bulletList(items) {
    if (!items || !items.length) return null;
    var ul = el("ul", "bullets");
    items.forEach(function (b) { add(ul, el("li", null, b)); });
    return ul;
  }

  function statRow(items) {
    if (!items || !items.length) return null;
    var dl = el("dl", "stat-row");
    items.forEach(function (s) {
      var box = el("div", "stat");
      add(box, el("dt", null, s.label));
      add(box, el("dd", null, s.value));
      add(dl, box);
    });
    return dl;
  }

  function sectionShell(id, eyebrow, title, lede) {
    var section = el("section", "section");
    section.id = id;
    var wrap = el("div", "wrap");
    add(wrap, el("span", "section-eyebrow", eyebrow));
    add(wrap, el("h2", "section-title", title));
    if (lede) add(wrap, el("p", "section-lede", lede));
    var body = el("div", "section-body");
    add(wrap, body);
    add(section, wrap);
    return { section: section, body: body };
  }

  /* ---------- intro ---------- */

  function renderIntro() {
    document.getElementById("intro-eyebrow").textContent = CONTENT.introEyebrow;
    document.getElementById("intro-name").textContent = CONTENT.name;
    document.getElementById("header-mark").textContent = CONTENT.name;
    document.title = CONTENT.name + " 포트폴리오";

    // 칩을 가장자리에 흩뿌린다. 가운데 글자와 겹치지 않는 자리만 쓴다.
    var spots = [
      [9, 6], [17, 62], [26, 80], [34, 12], [46, 84],
      [58, 4], [68, 70], [76, 20], [85, 58], [13, 34],
      [90, 12], [40, 92],
    ];
    var box = document.getElementById("intro-chips");
    (CONTENT.introChips || []).forEach(function (label, i) {
      var spot = spots[i % spots.length];
      var chip = el("span", i < 4 ? "chip chip-keep" : "chip", label);
      chip.style.top = spot[0] + "%";
      chip.style.left = spot[1] + "%";
      chip.style.animationDelay = (-(i * 0.73) % 7).toFixed(2) + "s";
      add(box, chip);
    });
  }

  /* ---------- hero ---------- */

  function renderHero() {
    var section = el("section", "hero wrap");
    section.id = "hero";
    var grid = el("div", "hero-grid");

    var left = el("div");
    add(left, el("h1", "hero-name", CONTENT.name));
    add(left, el("p", "hero-role", CONTENT.role));
    if (CONTENT.tagline) add(left, el("p", "hero-tagline", CONTENT.tagline));

    var actions = el("div", "hero-actions");
    if (CONTENT.projects && CONTENT.projects.length) {
      var a1 = el("a", "btn btn-primary", "프로젝트 보기");
      a1.href = "#projects";
      add(actions, a1);
    }
    if (CONTENT.contact && CONTENT.contact.github) {
      var a2 = el("a", "btn", "GitHub ↗");
      a2.href = "https://github.com/" + CONTENT.contact.github;
      a2.target = "_blank";
      a2.rel = "noopener";
      add(actions, a2);
    }
    var a3 = el("a", "btn", "연락처");
    a3.href = "#contact";
    add(actions, a3);
    add(left, actions);
    add(grid, left);

    var figure = el("figure", "hero-portrait");
    if (CONTENT.photo) {
      figure.classList.add("has-photo");
      var img = el("img");
      img.src = CONTENT.photo;
      img.alt = CONTENT.name + " 프로필 사진";
      add(figure, img);
    } else {
      add(figure, el("span", "portrait-monogram", CONTENT.monogram));
      add(figure, el("figcaption", "portrait-caption", CONTENT.nameEn));
    }
    add(grid, figure);

    add(section, grid);
    return section;
  }

  /* ---------- about ---------- */

  function renderAbout() {
    var about = CONTENT.about;
    if (!about || !(about.paragraphs || []).length) return null;

    var shell = sectionShell("about", "About", "소개");
    shell.body.classList.add("about-grid");

    var prose = el("div", "prose");
    about.paragraphs.forEach(function (p) { add(prose, el("p", null, p)); });
    add(shell.body, prose);

    if ((about.focus || []).length) {
      var list = el("ul", "focus-list");
      about.focus.forEach(function (f, i) {
        var li = el("li");
        add(li, el("span", "focus-index", String(i + 1).padStart(2, "0")));
        var label = el("span", "focus-label", f.label);
        if (f.note) add(label, el("span", "focus-note", f.note));
        add(li, label);
        add(list, li);
      });
      add(shell.body, list);
    }
    return shell.section;
  }

  /* ---------- skills ---------- */

  function renderSkills() {
    if (!(CONTENT.skills || []).length) return null;

    var shell = sectionShell(
      "skills", "Skills", "기술 스택",
      "전공과 SSAFY 과정, 팀 프로젝트에서 사용해 온 언어와 도구입니다. 활용수준은 초급 · 중급 · 고급 세 단계로 표기했습니다."
    );
    shell.body.classList.add("skill-groups");

    CONTENT.skills.forEach(function (group) {
      var card = el("div", "skill-group");
      add(card, el("h3", null, group.title));

      if ((group.levels || []).length) {
        var rows = el("ul", "skill-rows");
        group.levels.forEach(function (s) {
          var li = el("li");
          add(li, el("span", "skill-name", s.name));
          var meter = el("span", "level-meter");
          meter.setAttribute("aria-hidden", "true");
          for (var i = 1; i <= 3; i++) add(meter, el("i", i <= s.level ? "on" : null));
          add(li, meter);
          add(li, el("span", "level-label", LEVEL_NAMES[s.level] || ""));
          add(rows, li);
        });
        add(card, rows);
      }
      add(card, tagRow(group.tags));
      add(shell.body, card);
    });
    return shell.section;
  }

  /* ---------- projects ---------- */

  function renderProjects() {
    if (!(CONTENT.projects || []).length) return null;

    var shell = sectionShell(
      "projects", "Projects", "프로젝트",
      "AI 파이프라인과 사용자 인터페이스를 하나의 흐름으로 잇는 팀 프로젝트를 중심으로 정리했습니다."
    );
    shell.body.classList.add("project-list");

    CONTENT.projects.forEach(function (p) {
      var card = el("article", "project");

      var meta = el("div", "project-meta");
      if (p.date) add(meta, el("p", "project-date", p.date));
      if (p.status) {
        add(meta, el("span", "status status-" + (p.status.kind || "done"), p.status.label));
      }
      (p.meta || []).forEach(function (m) {
        var row = el("p", "project-role");
        add(row, el("span", null, m.label));
        row.appendChild(document.createTextNode(m.value));
        add(meta, row);
      });
      add(card, meta);

      var body = el("div");
      add(body, el("h3", "project-title", p.title));
      if (p.subtitle) add(body, el("p", "project-subtitle", p.subtitle));
      if (p.summary) add(body, el("p", "project-summary", p.summary));
      add(body, bulletList(p.bullets));
      add(body, tagRow(p.tags, "project-tags"));

      if ((p.links || []).length) {
        var links = el("div", "project-links");
        p.links.forEach(function (l) {
          var a = el("a", "link-pill", l.label + " ↗");
          a.href = l.url;
          a.target = "_blank";
          a.rel = "noopener";
          add(links, a);
        });
        add(body, links);
      }
      add(card, body);
      add(shell.body, card);
    });
    return shell.section;
  }

  /* ---------- experience ---------- */

  function renderExperience() {
    if (!(CONTENT.experience || []).length) return null;

    var shell = sectionShell("experience", "Experience", "경험");
    shell.body.classList.add("timeline");

    CONTENT.experience.forEach(function (x) {
      var item = el("article", "timeline-item");
      add(item, el("p", "timeline-date", x.date));
      var body = el("div");
      add(body, el("h3", "timeline-org", x.org));
      if (x.sub) add(body, el("p", "timeline-sub", x.sub));
      if (x.desc) add(body, el("p", "timeline-desc", x.desc));
      add(body, statRow(x.stats));
      add(body, bulletList(x.bullets));
      add(item, body);
      add(shell.body, item);
    });
    return shell.section;
  }

  /* ---------- certifications ---------- */

  function renderCertifications() {
    if (!(CONTENT.certifications || []).length) return null;

    var shell = sectionShell("certifications", "Certifications", "자격증");
    shell.body.classList.add("cert-list");

    CONTENT.certifications.forEach(function (c) {
      var card = el("article", "cert");
      if (c.date) add(card, el("p", "cert-date", c.date));
      add(card, el("h3", "cert-name", c.name));
      if (c.issuer) add(card, el("p", "cert-issuer", c.issuer));
      add(shell.body, card);
    });
    return shell.section;
  }

  /* ---------- contact ---------- */

  function renderContact() {
    var c = CONTENT.contact || {};
    var shell = sectionShell(
      "contact", "Contact", "연락처",
      "프로젝트나 채용 관련 문의는 이메일로 연락 주시면 가장 빠르게 확인합니다."
    );
    shell.body.classList.add("contact-grid");
    var dl = shell.body;
    dl.classList.add("contact-grid");

    function card(label, value, href) {
      var box = el("div", "contact-card");
      add(box, el("dt", null, label));
      var dd = el("dd");
      if (href) {
        var a = el("a", null, value);
        a.href = href;
        if (href.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
        add(dd, a);
      } else {
        dd.textContent = value;
      }
      add(box, dd);
      return box;
    }

    if (c.email) add(dl, card("Email", c.email, "mailto:" + c.email));
    if (c.phone) add(dl, card("Phone", c.phone));
    if (c.github) {
      add(dl, card("GitHub", "github.com/" + c.github, "https://github.com/" + c.github));
    }
    return shell.section;

    add(main, node);

  var nav = document.getElementById("site-nav");

    var a = el("a", null, item.label);
    a.href = "#" + item.id;

  add(footer, el("span", null, CONTENT.role));

  /* ---------- behavior ---------- */

  var intro = document.getElementById("intro");
  var enter = document.getElementById("intro-enter");
  var dismissed = false;

  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    intro.classList.add("is-dismissed");
    intro.setAttribute("aria-hidden", "true");
    // 트랜지션이 끝나면 완전히 제거한다. 배경 탭처럼 트랜지션이
    // 진행되지 않는 상황에서도 타이머가 확실히 숨긴다.
    intro.addEventListener("transitionend", hide, { once: true });
    setTimeout(hide, 700);
    window.removeEventListener("wheel", dismiss);
    window.removeEventListener("touchmove", dismiss);
    window.removeEventListener("keydown", onKey);
  }

  function hide() {
    intro.hidden = true;
  }

  function onKey(e) {
    if (e.key === "Escape" || e.key === "Enter" || e.key === " " ||
        e.key === "PageDown" || e.key === "ArrowDown") {
      dismiss();
    }
  }

  enter.addEventListener("click", function () {
    dismiss();
    var target = document.getElementById("hero");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  window.addEventListener("wheel", dismiss, { passive: true });
  window.addEventListener("touchmove", dismiss, { passive: true });
  window.addEventListener("keydown", onKey);

  var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
  var sections = links
    .map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); })
    .filter(Boolean);

  function setActive() {
    var pos = window.scrollY + window.innerHeight * 0.3;
    var current = null;
    sections.forEach(function (s) { if (s.offsetTop <= pos) current = s; });
    links.forEach(function (a) {
      a.classList.toggle("is-active", !!current && a.getAttribute("href") === "#" + current.id);
    });
  }

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { setActive(); ticking = false; });
  }, { passive: true });
  setActive();
})();
</script>
