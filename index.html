<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI·로보틱스·백엔드 개발자 권영호 포트폴리오">
<title>권영호 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root {
    --accent: #c97855;
    --accent-soft: #f1ddd2;
    --accent-strong: #9f573c;
    --accent-line: #ead1c4;
    --background: #fffdfa;
    --surface: #ffffff;
    --surface-soft: #f8f5ef;
    --surface-muted: #ebe4da;
    --border: #e5ded5;
    --border-strong: #d5cabe;
    --text-primary: #25231f;
    --text-secondary: #716b63;
    --text-subtle: #9a9187;
    --font-sans: "Pretendard Variable", Pretendard, "IBM Plex Sans KR", -apple-system,
      BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --max-width: 1220px;
    --header-height: 74px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --shadow: 0 18px 48px rgba(75, 57, 43, 0.08);
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    scroll-padding-top: var(--header-height);
  }

  body {
    margin: 0;
    background: var(--background);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, p, ul, ol, li, figure, dl, dd, dt { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3 { text-wrap: balance; letter-spacing: 0; }

  :focus-visible {
    outline: 3px solid var(--accent-soft);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
  }

  .wrap {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- 등장 애니메이션 ---------- */

  @keyframes revealUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .reveal { animation: revealUp 0.64s both; }

  /* ---------- 인트로 커버 ---------- */

  @keyframes floatRight {
    from { transform: translateY(-8px); }
    50%  { transform: translate(calc(50vw + 11rem), 8px); }
    to   { transform: translate(calc(100vw + 44rem), -8px); }
  }

  @keyframes floatLeft {
    from { transform: translateY(8px); }
    50%  { transform: translate(calc(-50vw - 11rem), -8px); }
    to   { transform: translate(calc(-100vw - 44rem), 8px); }
  }

  .intro-cover {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 32px;
    overflow: hidden;
    background:
      radial-gradient(circle at 78% 18%, rgba(201, 120, 85, 0.043), transparent 27rem),
      radial-gradient(circle at 14% 74%, rgba(154, 145, 135, 0.059), transparent 24rem),
      var(--background);
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  .intro-cover.is-closing { opacity: 0; pointer-events: none; }
  .intro-cover[hidden] { display: none; }

  .intro-floating {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    user-select: none;
  }

  .floating-keyword {
    position: absolute;
    top: var(--lane);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    padding: 5px 11px;
    border: 1px solid rgba(201, 120, 85, 0.42);
    border-radius: var(--radius-sm);
    background: rgba(255, 254, 250, 0.9);
    color: #8f4c34;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0.42;
    animation-name: floatRight;
    animation-duration: var(--duration);
    animation-delay: var(--delay);
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .floating-keyword.is-right { left: -22rem; }
  .floating-keyword.is-left { right: -22rem; animation-name: floatLeft; }

  .intro-content {
    position: relative;
    z-index: 1;
    display: grid;
    justify-items: center;
    width: min(100%, 760px);
  }

  .intro-copy { display: grid; gap: 24px; justify-items: center; text-align: center; }

  .intro-kicker {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    text-transform: uppercase;
    color: var(--accent-strong);
  }

  .intro-content h1 {
    font-size: clamp(4.2rem, 12vw, 8.4rem);
    font-weight: 780;
    line-height: 1;
  }

  .intro-title {
    max-width: 560px;
    font-size: clamp(1.15rem, 3vw, 1.65rem);
    font-weight: 600;
    color: var(--text-secondary);
    word-break: keep-all;
  }

  .intro-button {
    margin-top: 8px;
    min-height: 46px;
    padding: 0 18px;
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--surface);
    font: inherit;
    font-weight: 750;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .intro-button:hover, .intro-button:focus-visible {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
    transform: translateY(-2px);
  }

  /* ---------- 헤더 ---------- */

  .site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    min-height: var(--header-height);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 253, 250, 0.94);
    backdrop-filter: blur(16px);
  }

  .header-inner { display: flex; justify-content: flex-end; }

  .site-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .site-nav::-webkit-scrollbar { display: none; }

  .site-nav a {
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 0.9rem;
    white-space: nowrap;
    transition: color 0.18s ease, background 0.18s ease;
  }
  .site-nav a:hover, .site-nav a[aria-current="page"] {
    color: var(--accent-strong);
    background: var(--accent-soft);
  }

  /* ---------- 히어로 ---------- */

  .hero-section {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.95fr);
    align-items: center;
    gap: 70px;
    padding: 104px 0 92px;
  }

  .hero-copy { display: grid; gap: 24px; }

  .hero-kicker, .section-eyebrow, .project-period, .timeline-period {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0;
    color: var(--accent-strong);
  }

  .hero-copy h1 {
    max-width: 760px;
    font-size: clamp(4rem, 10vw, 7.8rem);
    font-weight: 760;
    line-height: 1;
  }

  .hero-title {
    max-width: 720px;
    font-size: clamp(1.45rem, 3vw, 2.25rem);
    font-weight: 600;
    line-height: 1.3;
    color: var(--text-primary);
  }

  .hero-intro {
    max-width: 680px;
    font-size: 1.08rem;
    color: var(--text-secondary);
    word-break: keep-all;
  }

  .hero-actions, .card-actions { display: flex; flex-wrap: wrap; gap: 12px; }

  .hero-profile-panel { display: grid; justify-items: center; }

  .hero-portrait {
    width: min(100%, 360px);
    overflow: hidden;
    background: #fff;
  }
  .hero-portrait picture { display: block; }
  .hero-portrait img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: center top;
  }

  .hero-portrait-fallback {
    display: grid;
    place-items: center;
    gap: 6px;
    width: min(100%, 360px);
    aspect-ratio: 3 / 4;
    background: var(--surface-soft);
    color: var(--text-subtle);
    font-weight: 700;
  }
  .hero-portrait-fallback strong {
    font-size: clamp(3rem, 6vw, 4.4rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--accent-strong);
    line-height: 1;
  }
  .hero-portrait-fallback span {
    font-family: var(--font-mono);
    font-size: 0.74rem;
    text-transform: uppercase;
  }

  /* ---------- 버튼 ---------- */

  .card-actions a, .card-actions button, .card-actions span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
    font: inherit;
    font-weight: 700;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .card-actions a:hover, .card-actions button:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card-actions .is-primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--surface);
  }
  .card-actions .is-primary:hover {
    border-color: var(--accent-strong);
    background: var(--accent-strong);
  }
  .card-actions span { color: var(--text-subtle); font-weight: 600; }

  /* ---------- 섹션 ---------- */

  .section {
    scroll-snap-align: start;
    padding: 92px 0;
    border-top: 1px solid var(--border);
  }

  .section-inner { display: grid; gap: 32px; }

  .section-heading { display: grid; gap: 10px; max-width: 820px; }
  .section-heading h2 { font-size: clamp(2.15rem, 5vw, 3.45rem); font-weight: 720; line-height: 1.1; }
  .section-heading p { color: var(--text-secondary); word-break: keep-all; }

  /* ---------- 소개 ---------- */

  .about-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr);
    gap: 32px;
    align-items: start;
  }

  .text-panel { display: grid; gap: 18px; }
  .text-panel p { color: var(--text-secondary); word-break: keep-all; }
  .text-panel strong { color: var(--text-primary); font-weight: 650; }

  .focus-list {
    display: grid;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    overflow: hidden;
  }
  .focus-list li {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 0.18s ease;
  }
  .focus-list li:last-child { border-bottom: none; }
  .focus-list li:hover { background: var(--surface-soft); }
  .focus-list b { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; color: var(--accent); }
  .focus-list strong { display: block; font-size: 0.98rem; font-weight: 650; }
  .focus-list em { display: block; font-style: normal; font-size: 0.88rem; color: var(--text-secondary); }

  /* ---------- 기술 스택 ---------- */

  #skills {
    min-height: calc(100vh - var(--header-height));
    display: grid;
    align-items: center;
  }

  .skills-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .skill-card {
    display: grid;
    align-content: start;
    gap: 16px;
    min-height: 210px;
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .skill-card:hover, .project-card:hover, .timeline-item:hover, .cert-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
    transform: translateY(-3px);
  }

  .skill-card h3 {
    font-size: 1.08rem;
    line-height: 1.2;
    text-align: center;
    word-break: keep-all;
  }

  .skill-card.is-language {
    grid-column: 1 / -1;
    min-height: 240px;
    align-content: center;
    padding: 36px;
  }
  .skill-card.is-language h3 { font-size: 1.5rem; }
  .skill-card.is-language .skill-chip-list { justify-content: center; }
  .skill-card.is-language .skill-chip {
    min-height: 48px;
    padding: 9px 14px;
    font-size: 1rem;
  }

  .skill-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }

  .skill-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 34px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    color: var(--text-primary);
    font-size: 0.84rem;
    font-weight: 650;
    overflow-wrap: anywhere;
  }
  .skill-meter {
    display: inline-grid;
    grid-template-columns: repeat(5, 5px);
    gap: 3px;
    padding-left: 8px;
    border-left: 1px solid var(--accent-line);
  }
  .skill-meter i {
    width: 5px;
    height: 13px;
    border-radius: 2px;
    background: var(--surface-muted);
  }
  .skill-meter i.is-filled { background: var(--accent); }

  /* ---------- 프로젝트 ---------- */

  .project-stack { border-top: 1px solid var(--border); }

  .project-page {
    min-height: calc(100vh - var(--header-height));
    display: grid;
    align-items: center;
    scroll-snap-align: start;
    padding: 72px 0;
    border-bottom: 1px solid var(--border);
  }

  .project-page-inner {
    display: grid;
    grid-template-columns: minmax(280px, 0.82fr) minmax(0, 1.18fr);
    align-items: stretch;
    gap: 28px;
  }

  .project-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .project-page .project-card { display: contents; }

  .project-page .project-media {
    min-height: 420px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .project-page .project-media.has-image {
    height: auto;
    min-height: 420px;
  }
  .project-page .project-media span { font-size: clamp(3rem, 8vw, 6.8rem); }

  .project-page .project-content {
    justify-content: center;
    padding: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
  }

  .project-media {
    display: grid;
    align-items: center;
    min-height: 86px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-soft);
  }
  .project-media span {
    font-family: var(--font-mono);
    font-size: 1.45rem;
    font-weight: 800;
    color: rgba(159, 87, 60, 0.42);
  }
  .project-media img { width: 100%; height: 100%; object-fit: cover; }
  .project-media.has-image {
    height: 190px;
    min-height: 190px;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
  }
  .project-media.has-image img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
    object-fit: contain;
  }

  .project-content { display: flex; flex-direction: column; flex: 1; gap: 17px; padding: 24px; }
  .project-content h3 { font-size: 1.45rem; font-weight: 700; line-height: 1.25; word-break: keep-all; }
  .project-subtitle { font-weight: 650; color: var(--text-primary); word-break: keep-all; }
  .project-content p { color: var(--text-secondary); word-break: keep-all; }

  .status-badge {
    width: fit-content;
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.78rem;
    font-weight: 700;
  }
  .status-live { background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent-line); }
  .status-done { background: var(--surface-muted); color: var(--text-secondary); border: 1px solid var(--border-strong); }

  .project-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; }
  .project-meta div { display: grid; gap: 4px; }
  .project-meta dt {
    font-family: var(--font-mono);
    font-size: 0.74rem;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  .project-meta dd { color: var(--text-secondary); font-size: 0.92rem; }

  .bullets { display: grid; gap: 9px; }
  .contribution-title {
    margin-top: 2px;
    font-size: 0.86rem;
    font-weight: 750;
    color: var(--text-primary);
  }
  .bullets li { position: relative; padding-left: 17px; color: var(--text-secondary); font-size: 0.95rem; word-break: keep-all; }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-list span {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 4px 10px;
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-family: var(--font-mono);
    font-size: 0.76rem;
    overflow-wrap: anywhere;
  }

  .project-card-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding: 0 24px 24px; }

  /* ---------- 협업 ---------- */

  .collab-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 16px;
  }

  .collab-card {
    display: grid;
    gap: 18px;
    align-content: start;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .collab-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
    transform: translateY(-3px);
  }

  .collab-head { display: grid; gap: 8px; }
  .collab-head h3 { font-size: 1.3rem; font-weight: 700; }
  .collab-head p { color: var(--text-secondary); word-break: keep-all; }

  .collab-rows { display: grid; }
  .collab-rows > div {
    display: grid;
    grid-template-columns: minmax(96px, auto) minmax(0, 1fr);
    gap: 8px 16px;
    padding: 11px 0;
    border-top: 1px dashed var(--border);
  }
  .collab-rows > div:first-child { border-top: none; padding-top: 0; }
  .collab-rows dt {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent-strong);
    overflow-wrap: anywhere;
  }
  .collab-rows dd { font-size: 0.92rem; color: var(--text-secondary); word-break: keep-all; }

  /* ---------- 경험 ---------- */

  .timeline { display: grid; gap: 16px; }

  .timeline-item {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 24px;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .timeline-item > div { display: grid; gap: 12px; }
  .timeline-item h3 { font-size: 1.3rem; font-weight: 700; word-break: keep-all; }
  .timeline-subtitle { font-weight: 650; color: var(--text-primary); }
  .timeline-item p { color: var(--text-secondary); word-break: keep-all; }

  .timeline-note { border-left: 2px solid var(--accent); padding-left: 12px; }

  .stat-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat-row div {
    display: grid;
    gap: 2px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    font-variant-numeric: tabular-nums;
  }
  .stat-row dt {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-subtle);
  }
  .stat-row dd { font-size: 0.92rem; font-weight: 650; }

  /* ---------- 자격증 ---------- */

  .cert-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 380px)); gap: 16px; }

  .cert-card {
    display: grid;
    gap: 10px;
    align-content: start;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .cert-card h3 { font-size: 1.2rem; font-weight: 700; }
  .cert-issuer { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--text-secondary); }

  }

  function linkRow(links, firstIsPrimary) {
    if (!links || !links.length) return null;
    var row = el("div", "card-actions");
    links.forEach(function (l, i) {
      var a = el("a", (firstIsPrimary && i === 0) ? "is-primary" : null, l.label + " ↗");
      a.href = l.url;
      if (l.url.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
      add(row, a);
    });
    return row;
  }

  function section(id, eyebrow, title, lede) {
    var s = el("section", "section reveal");
    s.id = id;
    var wrap = el("div", "wrap");
    var inner = el("div", "section-inner");
    var head = el("div", "section-heading");
    add(head, el("p", "section-eyebrow", eyebrow));
    add(head, el("h2", null, title));
    if (lede) add(head, el("p", null, lede));
    add(inner, head);
    var body = el("div");
    add(inner, body);
    add(wrap, inner);
    add(s, wrap);
    return { section: s, body: body };
  }

  /* ---------- 인트로 ---------- */

  function renderIntro() {
    document.title = CONTENT.name + " 포트폴리오";
    document.getElementById("intro-kicker").textContent = CONTENT.kicker;
    document.getElementById("intro-name").textContent = CONTENT.name;
    document.getElementById("intro-title").textContent = CONTENT.introTitle;

    var box = document.getElementById("intro-floating");
    (CONTENT.introChips || []).forEach(function (label, i) {
      var chip = el("span", "floating-keyword " + (i % 2 ? "is-left" : "is-right"), label);
      // 세로 레인을 고르게 나누고, 속도와 시작 시점을 흩어 같은 줄로 뭉치지 않게 한다
      chip.style.setProperty("--lane", (5 + (i * 7.6) % 84).toFixed(1) + "%");
      chip.style.setProperty("--duration", (26 + (i * 3.4) % 16).toFixed(1) + "s");
      chip.style.setProperty("--delay", (-((i * 2.9) % 30)).toFixed(1) + "s");
      add(box, chip);
    });
  }

  /* ---------- 히어로 ---------- */

  function renderHero() {
    var s = el("section", "hero-section wrap reveal");
    s.id = "hero";

    var copy = el("div", "hero-copy");
    add(copy, el("p", "hero-kicker", CONTENT.kicker));
    add(copy, el("h1", null, CONTENT.name));
    add(copy, el("p", "hero-title", CONTENT.role));
    if (CONTENT.intro) add(copy, el("p", "hero-intro", CONTENT.intro));

    var links = [];
    if ((CONTENT.projects || []).length) links.push({ label: "프로젝트 보기", url: "#projects" });
    if (CONTENT.contact && CONTENT.contact.github) {
      links.push({ label: "GitHub", url: "https://github.com/" + CONTENT.contact.github });
    }
    links.push({ label: "연락처", url: "#contact" });
    var actions = linkRow(links, true);
    if (actions) actions.className = "hero-actions card-actions";
    add(copy, actions);
    add(s, copy);

    var panel = el("div", "hero-profile-panel");
    var figure = el("figure", "hero-portrait");

    function showFallback() {
      figure.className = "hero-portrait-fallback";
      figure.textContent = "";
      add(figure, el("strong", null, CONTENT.monogram));
      add(figure, el("span", null, CONTENT.nameEn));
    }

    if (CONTENT.photo) {
      var img = el("img");
      img.alt = CONTENT.name + " 프로필 사진";
      img.width = 720;
      img.height = 960;
      img.decoding = "async";
      // 사진 파일이 없으면 깨진 이미지 대신 이름 글자를 보여준다
      img.addEventListener("error", showFallback, { once: true });
      img.src = CONTENT.photo;

      if (CONTENT.photoWebp) {
        // WebP 를 읽을 수 있는 브라우저는 가벼운 쪽을, 나머지는 위의 사진을 쓴다
        var picture = document.createElement("picture");
        var source = document.createElement("source");
        source.type = "image/webp";
        source.srcset = CONTENT.photoWebp;
        picture.appendChild(source);
        picture.appendChild(img);
        add(figure, picture);
      } else {
        add(figure, img);
      }
    } else {
      showFallback();
    }
    add(panel, figure);
    add(s, panel);
    return s;
  }

  /* ---------- 소개 ---------- */

  function renderAbout() {
    var about = CONTENT.about;
    if (!about || !(about.paragraphs || []).length) return null;

    var shell = section("about", "About", "소개", about.lede);
    shell.body.className = "about-grid";

    var panel = el("div", "text-panel");
    about.paragraphs.forEach(function (p) { add(panel, richText(el("p"), p)); });
    add(shell.body, panel);

    if ((about.focus || []).length) {
      var list = el("ul", "focus-list");
      about.focus.forEach(function (f, i) {
        var li = el("li");
        add(li, el("b", null, String(i + 1).padStart(2, "0")));
        var body = el("div");
        add(body, el("strong", null, f.label));
        if (f.note) add(body, el("em", null, f.note));
        add(li, body);
        add(list, li);
      });
      add(shell.body, list);
    }
    return shell.section;
  }

  /* ---------- 기술 스택 ---------- */

  function renderSkills() {
    if (!(CONTENT.skills || []).length) return null;

    var shell = section(
      "skills", "Skills", "기술 스택",
      "프로젝트에서 사용한 언어와 도구입니다."
    );
    shell.body.className = "skills-grid";

    CONTENT.skills.forEach(function (group, index) {
      var card = el("div", "skill-card" + (index === 0 ? " is-language" : ""));
      add(card, el("h3", null, group.title));
      var list = el("div", "skill-chip-list");
      (group.chips || []).forEach(function (raw) {
        var parts = String(raw).split("|");
        var chip = el("span", "skill-chip", parts[0].trim());
        if (parts[1]) {
          var level = Math.max(0, Math.min(5, Number(parts[1].trim()) || 0));
          var meter = el("span", "skill-meter");
          meter.setAttribute("role", "img");
          meter.setAttribute("aria-label", "활용도 " + level + "/5");
          for (var i = 1; i <= 5; i += 1) {
            add(meter, el("i", i <= level ? "is-filled" : null));
          }
          add(chip, meter);
        }
        add(list, chip);
      });
      add(card, list);
      add(shell.body, card);
    });
    return shell.section;
  }

  /* ---------- 프로젝트 ---------- */

  function renderProjects() {
    if (!(CONTENT.projects || []).length) return null;

    var stack = el("div", "project-stack");
    stack.id = "projects";

    CONTENT.projects.forEach(function (p, index) {
      var page = el("section", "project-page");
      page.id = "project-" + String(index + 1).padStart(2, "0");
      var inner = el("div", "wrap project-page-inner");
      var card = el("article", "project-card");

      var media = el("div", "project-media");
      if (p.image) {
        media.className += " has-image";
        var image = el("img");
        image.src = p.image;
        image.alt = p.title + " 프로젝트 이미지";
        image.loading = "lazy";
        add(media, image);
      } else {
        add(media, el("span", null, p.initial || ""));
      }
      add(card, media);

      var body = el("div", "project-content");
      add(body, el("p", "section-eyebrow", "Project " + String(index + 1).padStart(2, "0") + " / " + String(CONTENT.projects.length).padStart(2, "0")));
      if (p.period) add(body, el("p", "project-period", p.period));
      if (p.status) add(body, el("span", "status-badge status-" + (p.status.kind || "done"), p.status.label));
      add(body, el("h3", null, p.title));
      if (p.subtitle) add(body, el("p", "project-subtitle", p.subtitle));
      add(body, metaList(p.meta));
      if ((p.bullets || []).length) add(body, el("p", "contribution-title", "내 기여"));
      add(body, bulletList(p.bullets));
      add(body, tagList(p.tags));

      var actions = linkRow(p.links, false);
      if (actions) add(body, actions);

      add(card, body);
      add(inner, card);
      add(page, inner);
      add(stack, page);
    });
    return stack;
  }

  /* ---------- 협업 ---------- */

  function renderCollaboration() {
    var c = CONTENT.collaboration;
    if (!c || !(c.areas || []).length) return null;

    var shell = section("collaboration", "Collaboration", "협업", c.lede);
    shell.body.className = "collab-grid";

    c.areas.forEach(function (area) {
      var card = el("div", "collab-card");

      var head = el("div", "collab-head");
      add(head, el("h3", null, area.title));
      if (area.summary) add(head, el("p", null, area.summary));
      add(card, head);

      if ((area.rows || []).length) {
        var dl = el("dl", "collab-rows");
        area.rows.forEach(function (r) {
          var box = el("div");
          add(box, el("dt", null, r.term));
          add(box, el("dd", null, r.desc));
          add(dl, box);
        });
        add(card, dl);
      }
      add(card, bulletList(area.notes));
      add(shell.body, card);
    });
    return shell.section;
  }

  /* ---------- 경험 ---------- */

  function renderExperience() {
    if (!(CONTENT.experience || []).length) return null;

    var shell = section("experience", "Experience", "경험");
    shell.body.className = "timeline";

    CONTENT.experience.forEach(function (x) {
      var item = el("article", "timeline-item");
      add(item, el("p", "timeline-period", x.period));
      var body = el("div");
      add(body, el("h3", null, x.org));
      if (x.sub) add(body, el("p", "timeline-subtitle", x.sub));
      if (x.note) add(body, el("p", "timeline-note", x.note));
      add(body, statRow(x.stats));
      add(body, bulletList(x.bullets));
      add(item, body);
      add(shell.body, item);
    });
    return shell.section;
  }

  /* ---------- 자격증 ---------- */

  function renderCertifications() {
    if (!(CONTENT.certifications || []).length) return null;

    var shell = section("certifications", "Certifications", "자격증");
    shell.body.className = "cert-list";

    CONTENT.certifications.forEach(function (c) {
      var card = el("article", "cert-card");
      if (c.date) add(card, el("p", "project-period", c.date));
      add(card, el("h3", null, c.name));
      if (c.issuer) add(card, el("p", "cert-issuer", c.issuer));
      add(shell.body, card);
    });
    return shell.section;
  }

  /* ---------- 연락처 ---------- */

  function renderContact() {
    var c = CONTENT.contact || {};
    var shell = section(
      "contact", "Contact", "연락처",
      "프로젝트나 채용 관련 문의는 이메일로 연락 주시면 가장 빠르게 확인합니다."
    );
    var panel = el("dl", "contact-panel");
    shell.body.appendChild(panel);

    function card(label, value, href) {
      var box = el("div");
      add(box, el("dt", null, label));
      var dd = el("dd");
      if (href) {
        var a = el("a", null, value);
        a.href = href;
        if (href.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
        add(dd, a);
      } else {
        dd.textContent = value;
      }
      add(box, dd);
      add(panel, box);
    }

    if (c.email) card("Email", c.email, "mailto:" + c.email);
    if (c.phone) card("Phone", c.phone);
    if (c.github) card("GitHub", "github.com/" + c.github, "https://github.com/" + c.github);

    // 칸이 3개보다 적으면 열 수를 줄여 빈틈이 생기지 않게 한다
    var n = panel.children.length;
    if (n && n < 3) panel.style.gridTemplateColumns = "repeat(" + n + ", minmax(0, 1fr))";
    return shell.section;
  }

  /* ---------- 조립 ---------- */

  renderIntro();

  var main = document.getElementById("main");
  var navItems = [];

  add(main, renderHero());

  [
    ["about", "소개", renderAbout],
    ["skills", "기술 스택", renderSkills],
    ["projects", "프로젝트", renderProjects],
    ["collaboration", "협업", renderCollaboration],
    ["experience", "경험", renderExperience],
    ["certifications", "자격증", renderCertifications],
    ["contact", "연락처", renderContact],
  ].forEach(function (entry) {
    var node = entry[2]();
    if (!node) return;
    add(main, node);
    navItems.push({ id: entry[0], label: entry[1] });
  });

  // 섹션이 차례로 올라오도록 시작 시점을 조금씩 늦춘다
  Array.prototype.slice.call(document.querySelectorAll(".reveal")).forEach(function (node, i) {
    node.style.animationDelay = Math.min(i * 0.06, 0.42) + "s";
  });

  var nav = document.getElementById("site-nav");
  navItems.forEach(function (item) {
    var a = el("a", null, item.label);
    a.href = "#" + item.id;
    add(nav, a);
  });

  var footer = document.getElementById("site-footer");
  add(footer, el("span", null, "© " + new Date().getFullYear() + " " + CONTENT.name));
  add(footer, el("span", null, CONTENT.kicker));

  /* ---------- 동작 ---------- */

  var intro = document.getElementById("intro");
  var enter = document.getElementById("intro-enter");
  var closed = false;

  function hide() { intro.hidden = true; }

  function close() {
    if (closed) return;
    closed = true;
    intro.classList.add("is-closing");
    intro.setAttribute("aria-hidden", "true");
    // 트랜지션이 끝나면 완전히 제거한다. 배경 탭처럼 트랜지션이
    // 진행되지 않는 상황에서도 타이머가 확실히 숨긴다.
    intro.addEventListener("transitionend", hide, { once: true });
    setTimeout(hide, 700);
    window.removeEventListener("wheel", close);
    window.removeEventListener("touchmove", close);
    window.removeEventListener("keydown", onKey);
  }

  function onKey(e) {
    if (e.key === "Escape" || e.key === "Enter" || e.key === " " ||
        e.key === "PageDown" || e.key === "ArrowDown") {
      close();
    }
  }

  enter.addEventListener("click", function () {
    close();
    var target = document.getElementById("hero");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  window.addEventListener("wheel", close, { passive: true });
  window.addEventListener("touchmove", close, { passive: true });
  window.addEventListener("keydown", onKey);

  var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
  var sections = links
    .map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); })
    .filter(Boolean);

  function setActive() {
    var pos = window.scrollY + window.innerHeight * 0.3;
    var current = null;
    sections.forEach(function (s) { if (s.offsetTop <= pos) current = s; });
    links.forEach(function (a) {
      if (current && a.getAttribute("href") === "#" + current.id) {
        a.setAttribute("aria-current", "page");
      } else {
        a.removeAttribute("aria-current");
      }
    });
  }

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { setActive(); ticking = false; });
  }, { passive: true });
  setActive();
})();
</script>
</body>
</html>
